<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1B1B2F"><meta name="description" content="Plume is a lightweight browser-based image editor with layers, drawing tools, adjustments, and PSD/PSB workflows. Free editing for life."><meta property="og:title" content="Plume — Free Image Editor"><meta property="og:description" content="A lightweight image editor that runs in your browser. Free editing for life."><meta property="og:type" content="website"><meta property="og:url" content="https://plume.build/"><meta name="twitter:card" content="summary"><title>Plume — Free Image Editor</title><link rel="icon" type="image/svg+xml" href="../assets/brand/plume-mark.svg"><link rel="stylesheet" href="../src/styles.css"></head><body><div id="app">
<header class="topbar"><a class="brand" href="../" aria-label="Plume home"><span class="brand-mark"><img src="../assets/brand/plume-mark.svg" alt=""></span><span>Plume</span></a><nav class="menu"><button data-menu="file">File</button><button data-menu="edit">Edit</button><button data-menu="image">Image</button><button data-menu="view">View</button></nav><div class="doc-title"><input id="docName" value="Untitled project" aria-label="Project name"><span id="dirty" class="dirty">●</span></div><div class="header-actions"><button class="btn" id="openFile">Open image</button><button class="btn" id="openProject">Open project / PSD</button><button class="btn" id="saveProject">Save .studio</button><button class="btn" id="exportNative" title="Export layered Photoshop document">Export PSD</button><select class="btn format-select" id="nativeFormat" aria-label="Native export format"><option value="psd">PSD</option><option value="psb">PSB</option></select><button class="btn primary" id="exportImage">Export image</button><button class="iconbtn mobile-toggle" id="toggleLayers" title="Layers">▤</button></div><input hidden id="imageInput" type="file" accept="image/*"><input hidden id="projectInput" type="file" accept=".studio,.json,.psd,.psb,application/json,image/vnd.adobe.photoshop"></header>
<div class="optionsbar"><div id="toolOptions">Brush</div><label class="option">Feather <input id="selectionFeather" type="number" min="0" max="100" value="0" title="Selection feather radius in pixels"><output>px</output></label><div class="option-sep"></div><label class="option">Size <input id="brushSize" type="range" min="1" max="200" value="18"><output id="sizeValue">18</output></label><label class="option">Opacity <input id="brushOpacity" type="range" min="1" max="100" value="100"><output id="opacityValue">100%</output></label><label class="option" id="colorOption">Color <input id="foreground" type="color" value="#efeff1"></label><div class="options-spacer"></div><button class="iconbtn" id="undo" title="Undo (Ctrl+Z)">↶</button><button class="iconbtn" id="redo" title="Redo (Ctrl+Shift+Z)">↷</button><label class="option zoom-label">Zoom <input id="zoom" type="range" min="20" max="200" value="80"><output id="zoomValue">80%</output></label></div>
<main class="shell"><aside class="toolbar" aria-label="Tools"><button class="tool active" data-tool="move" title="Move (V)">✥</button><button class="tool" data-tool="brush" title="Brush (B)">╱</button><button class="tool" data-tool="eraser" title="Eraser (E)">◩</button><button class="tool" data-tool="line" title="Line (L)">／</button><button class="tool" data-tool="rect" title="Rectangle (U)">▱</button><button class="tool" data-tool="ellipse" title="Ellipse">◯</button><button class="tool" data-tool="text" title="Text (T)">T</button><button class="tool" data-tool="fill" title="Fill (G)">▨</button><button class="tool" data-tool="crop" title="Crop (C)">⌗</button><button class="tool" data-tool="picker" title="Eyedropper (I)">◉</button><button class="tool" data-tool="select" title="Rectangular marquee (M)">▧</button><button class="tool" data-tool="ellipseSelect" title="Ellipse selection">◯</button><button class="tool" data-tool="lasso" title="Freehand lasso selection">〰</button><button class="tool" data-tool="polygonSelect" title="Polygon selection · double-click to finish">⬠</button><button class="tool" data-tool="clone" title="Clone stamp · Alt-click to sample visible pixels">⧉</button><button class="tool" data-tool="heal" title="Heal · Alt-click to sample; blends toward local color">✣</button><button class="tool" data-tool="gradient" title="Gradient (D)">◩</button><button class="tool" data-tool="blur" title="Blur tool">◌</button></aside>
<section class="workarea" id="workarea"><div class="canvas-wrap" id="canvasWrap"><div class="canvas-stack" id="canvasStack"></div></div><div class="welcome" id="welcome"><div class="welcome-icon">✦</div><h1>Create something</h1><p>Open an image or start with a blank canvas.</p><div><button class="btn primary" id="welcomeNew">New canvas</button> <button class="btn" id="welcomeOpen">Open image</button></div></div></section>
<aside class="sidebar" id="sidebar"><div class="side-tabs"><button class="side-tab selected" data-panel="layersPanel">Layers</button><button class="side-tab" data-panel="adjustPanel">Adjust</button></div><section id="layersPanel" class="side-content"><div class="section-head"><span>Layers</span><div><button class="iconbtn small" id="addLayer" title="New layer">＋</button><button class="iconbtn small" id="deleteLayer" title="Delete layer">⌫</button></div></div><div class="layer-list" id="layerList"></div><div class="layer-props"><label>Opacity <input id="layerOpacity" type="range" min="0" max="100" value="100"><output id="layerOpacityValue">100%</output></label><label class="blend-label">Blend <select id="blendMode"><option value="source-over">Normal</option><option value="multiply">Multiply</option><option value="screen">Screen</option><option value="overlay">Overlay</option><option value="darken">Darken</option><option value="lighten">Lighten</option><option value="color-dodge">Color dodge</option><option value="color-burn">Color burn</option><option value="difference">Difference</option></select></label><div class="layer-actions"><button class="btn" id="duplicateLayer">Duplicate</button><button class="btn" id="addMask">Add mask</button><button class="btn" id="editContent">Edit content</button><button class="btn" id="renameLayer">Rename</button><button class="btn" id="moveUp">↑</button><button class="btn" id="moveDown">↓</button></div></div><div class="section-head">Canvas</div><div class="canvas-props"><label>Width <input id="canvasWidth" type="number" min="1" max="6000" value="1200"></label><label>Height <input id="canvasHeight" type="number" min="1" max="6000" value="800"></label><button class="btn" id="resizeCanvas">Resize</button><button class="btn" id="rotateLeft">↶ Rotate 90°</button><button class="btn" id="rotateRight">↷ Rotate 90°</button><button class="btn" id="flipH">Flip horizontal</button><button class="btn" id="flipV">Flip vertical</button></div></section><section id="adjustPanel" class="side-content hidden"><div class="section-head">Image adjustments</div><p class="hint">These live, reversible adjustments affect only the selected layer.</p><label class="adjust-row">Brightness <input id="brightness" type="range" min="-100" max="100" value="0"><output>0</output></label><label class="adjust-row">Contrast <input id="contrast" type="range" min="-100" max="100" value="0"><output>0</output></label><label class="adjust-row">Saturation <input id="saturation" type="range" min="-100" max="100" value="0"><output>0</output></label><button class="btn full" id="toggleMaskEdit">Edit layer pixels</button><button class="btn full" id="resetAdjust">Reset layer adjustments</button><div class="section-head">Quick filters</div><div class="filter-grid"><button class="btn" data-filter="grayscale">Grayscale</button><button class="btn" data-filter="sepia">Sepia</button><button class="btn" data-filter="invert">Invert</button><button class="btn" data-filter="blur">Blur 2 px</button><button class="btn" data-filter="sharpen">Sharpen</button><button class="btn" data-filter="posterize">Posterize</button></div></section></aside></main><footer class="statusbar"><span id="statusDimensions">No document</span><span id="statusTool">Move tool</span><span class="status-spacer"></span><span>Plume · Local editing</span><a class="support-link" href="../report.html" target="_blank" rel="noopener noreferrer">Report a problem</a><a class="support-link" href="https://buymeacoffee.com/plume.build" target="_blank" rel="noopener noreferrer">☕ Support Plume</a></footer><dialog id="textDialog" class="edit-dialog"><form id="textForm"><h2 id="textDialogTitle">Text layer</h2><label>Text <textarea id="textValue" rows="4" maxlength="2000" required></textarea></label><div class="edit-dialog-grid"><label>Size <input id="textSize" type="number" min="1" max="1000" value="36"></label><label>Font <select id="textFont"><option>Segoe UI</option><option>Arial</option><option>Georgia</option><option>Courier New</option><option>Impact</option></select></label><label>Color <input id="textColor" type="color" value="#efeff1"></label></div><div class="dialog-actions"><button class="btn" type="button" id="cancelText">Cancel</button><button class="btn primary" type="submit">Apply</button></div></form></dialog><dialog id="exportDialog" class="edit-dialog"><form id="exportForm"><h2>Export image</h2><label>Format <select id="exportFormat"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></label><label id="exportQualityRow">Quality <input id="exportQuality" type="range" min="1" max="100" value="90"><output id="exportQualityValue">90%</output><small>Used for JPEG and WebP. PNG keeps full quality and transparency.</small></label><div class="dialog-actions"><button class="btn" type="button" id="cancelExport">Cancel</button><button class="btn primary" type="submit">Save image</button></div></form></dialog><div id="toast" role="status" class="toast"></div></div><script src="../src/vendor/ag-psd-34.1.0.js"></script><script type="module" src="../src/app.js"></script></body></html>
